<script type="text/javascript">
 RED.nodes.registerType('IBool in', {
     category: 'IDM',
     color: '#a6bb00',
     defaults: {
	 name: {value: ""},
	 addr: {value: "", required: true},
	 router: {value: "", required: true, type: "idm-router"},
	 adapter: {value: "", required: true, type: "ice-adapter"},
     },
     inputs:0,
     outputs:1,
     icon: "button.png",

     label: function() {
	 if (this.addr)
	     return this.addr.toUpperCase();
	 return this.name || "IBool";
     },
 });
</script>

<script type="text/x-red" data-template-name="IBool in">
  <div class="form-row">
    <label for="node-input-addr"><i class="fa fa-fw fa-suitcase"></i> Destination: </label>
    <input type="text" id="node-input-addr" placeholder="aa:bb">
  </div>

  <div class="form-row">
    <label for="node-input-router"><i class="fa fa-fw fa-map-signs"></i> IDM Router: </label>
    <input type="text" id="node-input-router">
  </div>

  <div class="form-row">
    <label for="node-input-adapter"><i class="fa fa-fw fa-gears"></i> Ice Adapter: </label>
    <input type="text" id="node-input-adapter">
  </div>
</script>

<script type="text/x-red" data-help-name="IBool in">
  <p>This node creates a servant of DUO.IDM.IBool.W, and registers it on IDM.</p>

  <p>It has three properties that should be set:</p>
  <ul>
    <li><b>Address</b>: this object's IDM address (like <code>10:01</code>)</li>
    <li><b>IDM Router</b>: the IDM router where it will be announced </li>
    <li><b>Ice Adapter</b>: the Ice object adapter where to register this servant</li>
  </ul>

  <p>The <code>DUO.IDM.IBool.W</code> interface is the following:
    <pre>
 module IBool {
     interface W {
	 void set(bool v, IDM::Address source);
     };
 };
    </pre>
  </p>

  <p>When the method 'set' is called, it will inject a new <code>msg</code> with <code>true</code> or <code>false</code> as <code>msg.payload</code>,
  according to the value passed on 'set'.
  </p>

</script>
