<script type="text/javascript">
 RED.nodes.registerType('IBool in', {
     category: 'IDM',
     color: '#a6bb00',
     defaults: {
	 name: {value: ""},
	 topic: {value: ""},
	 addr: {value: "", required: true},
	 router: {value: "", required: true, type: "idm-router"},
	 adapter: {value: "", required: true, type: "ice-adapter"},
     },
     inputs:0,
     outputs:1,
     icon: "button.png",

     label: function() {
	 var retval = "";
	 if (this.name) {
	     retval += this.name;
	     if (this.addr)
		 retval += " [" + this.addr + "]";
	 }
	 else if (this.addr)
	     retval = this.addr.toUpperCase();
	 else
	     retval = "IBool";

	 if (this.topic)
	     retval = this.topic + ": " + retval;
	 return retval;
     },
 });
</script>

<script type="text/x-red" data-template-name="IBool in">
  <div class="form-row">
    <label for="node-input-addr"><i class="fa fa-fw fa-suitcase"></i> Address: </label>
    <input type="text" id="node-input-addr" placeholder="aa:bb">
  </div>

  <div class="form-row">
    <label for="node-input-router"><i class="fa fa-fw fa-map-signs"></i> IDM Router: </label>
    <input type="text" id="node-input-router">
  </div>

  <div class="form-row">
    <label for="node-input-adapter"><i class="fa fa-fw fa-gears"></i> Ice Adapter: </label>
    <input type="text" id="node-input-adapter">
  </div>

  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-fw fa-tasks"></i> Topic:</label>
    <input type="text" id="node-input-topic">
  </div>

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-fw fa-tag"></i> Name: </label>
    <input type="text" id="node-input-name">
  </div>
</script>

<script type="text/x-red" data-help-name="IBool in">
  <h3><b>Overview</b></h3>

  <p>This node creates a servant of <code>DUO.IBool.W</code>, and
    registers it on <i>IDM</i>. Other clients of the <i>IDM</i> network
    can change its state, just using its <i>IDM</i> address.</p>

  <p>The <code>DUO.IDM.IBool.W</code> interface is as follows:
    <pre>
module IBool {
  interface W {
    void set(bool v, IDM::Address source);
  };
};</pre></p>

  <p>When the method 'set' is called, it will inject a new <code>msg</code> with
    <code>true</code> or <code>false</code> as <code>msg.payload</code>, according to the
    value passed on 'set'.</p>

  <h3><b>Properties</b></h3>

  <ul><li><b>Address</b>: this is the <i>IDM</i> address of the
    servant. The format is two bytes in hexadacimal, separated by a colon
    (like <code>"AA:01"</code>).</li></ul>

  <ul><li><b>IDM Router</b>: the router that will be used to <i>receive</i> the
    invocations.
    It's a configuration node, see its 'info' tab for more details.</li></ul>

  <ul><li><b>Ice Adapter</b>: this is the <i>Object Adapter</i> where
    this servant will be attached. It works as a dispatcher to allow
    <i>many servants</i> to share the same connection endpoints.
    It's a configuration node, see its 'info' tab for more details.</li></ul>

  <ul><li><b>Topic</b>: the name of the <code>topic</code> property
    in the injected message.</li></ul>

  <ul><li><b>Name</b>: the name of this node.</li></ul>

</script>
