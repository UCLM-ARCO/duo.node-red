<script type="text/javascript">
 RED.nodes.registerType('toggle out', {
     category: 'output',
     color: '#a6bb00',
     defaults: {
	 name: {value: ""},
     },
     inputs:1,
     outputs:0,
     icon: "button.png",
     align: 'right',
     paletteLabel: "toggle",

     label: function() {
	 if (this.name)
	     return this.name;
	 return "toggle";
     },
 });
</script>

<script type="text/x-red" data-template-name="toggle out">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-fw fa-tag"></i> Name:</label>
    <input type="text" id="node-input-name">
  </div>
</script>

<script type="text/x-red" data-help-name="toggle out">
  <p>A simple widget to show the payload of the last message. If <code>payload</code> is True,
    it will show as active; inactive otherwise.
  </p>
</script>
